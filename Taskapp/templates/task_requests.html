{% load static %}
<style>
    /* Custom Tooltip & Text Truncation for Task Requests */
    .task-name-truncate {
        max-width: 200px !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        display: block !important;
    }

    .task-desc-truncate {
        max-width: 280px !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        display: block !important;
    }

    /* Hover Tooltip Popup */
    [data-tooltip] {
        position: relative;
        cursor: pointer;
    }

    [data-tooltip]:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(-6px);
        background: #0f172a;
        color: #ffffff;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
        white-space: normal;
        word-break: break-word;
        max-width: 360px;
        width: max-content;
        box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
        z-index: 999999;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    [data-tooltip]:hover::before {
        content: '';
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(0px);
        border-width: 6px 6px 0 6px;
        border-style: solid;
        border-color: #0f172a transparent transparent transparent;
        z-index: 999999;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    [data-tooltip]:hover::after,
    [data-tooltip]:hover::before {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(-2px);
    }
</style>
<div class="table-card" style="margin-top: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
        <h3 style="font-size: 18px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-code-pull-request" style="color: var(--primary);"></i> Multi-Project / Task Requests
        </h3>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Filter Status:</span>
            <select id="request-status-filter" class="filter-status-select" onchange="filterTaskRequests(this.value)" style="padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 500;">
                <option value="ALL">All Requests</option>
                <option value="Pending" selected>Pending Only</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
            </select>
            <button class="btn btn-secondary" onclick="loadTaskRequestsTab()" style="padding: 7px 14px; font-size: 13px; border-radius: 8px;">
                <i class="fa-solid fa-arrows-rotate"></i> Refresh
            </button>
        </div>
    </div>

    <div class="table-responsive" style="overflow-x: auto;">
        <table class="data-table" id="task-requests-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0; text-align: left; font-size: 13px; color: #64748b;">
                    <th style="padding: 12px 16px;">#</th>
                    <th style="padding: 12px 16px;">Employee</th>
                    <th style="padding: 12px 16px;">Task Name</th>
                    <th style="padding: 12px 16px;">Project Name</th>
                    <th style="padding: 12px 16px;">Request Reason</th>
                    <th style="padding: 12px 16px;">Date Requested</th>
                    <th style="padding: 12px 16px;">Status</th>
                    <th style="padding: 12px 16px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="task-requests-tbody">
                <tr>
                    <td colspan="8" style="text-align: center; padding: 30px; color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
                        <p style="margin-top: 10px; font-size: 14px;">Loading task requests...</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Global variable to store task requests loaded from Django API
    window.allTaskRequests = [];

    // Function to fetch task requests from the Django backend
    function loadTaskRequestsTab(isSilent) {
        if (isSilent === undefined) {
            isSilent = false;
        }

        var tbody = document.getElementById('task-requests-tbody');
        if (!tbody) {
            return;
        }
        
        // Show loading spinner if not a silent background refresh
        if (!isSilent && window.allTaskRequests.length === 0) {
            tbody.innerHTML = '<tr>' +
                '<td colspan="8" style="text-align: center; padding: 30px; color: var(--text-muted);">' +
                    '<i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>' +
                    '<p style="margin-top: 10px; font-size: 14px;">Loading task requests...</p>' +
                '</td>' +
            '</tr>';
        }

        // Fetch task requests from the Django endpoint
        fetch('/api/tasks/requests/', { credentials: 'same-origin' })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.status === 'success') {
                    window.allTaskRequests = data.requests || [];
                    
                    // Check currently selected filter dropdown value
                    var filterSelect = document.getElementById('request-status-filter');
                    var selectedFilter = filterSelect ? filterSelect.value : 'ALL';
                    
                    renderTaskRequestsTable(selectedFilter);
                } else if (!isSilent) {
                    var errorMsg = data.message || 'Failed to load task requests.';
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--danger); padding: 20px;">' + errorMsg + '</td></tr>';
                }
            })
            .catch(function(error) {
                if (!isSilent) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--danger); padding: 20px;">Error connecting to server.</td></tr>';
                }
            });
    }

    // Function to render the table rows based on selected status filter
    function renderTaskRequestsTable(filterValue) {
        var tbody = document.getElementById('task-requests-tbody');
        if (!tbody) {
            return;
        }

        var requestsList = window.allTaskRequests || [];
        
        // Filter the list if a specific status is chosen
        if (filterValue && filterValue !== 'ALL') {
            requestsList = requestsList.filter(function(item) {
                return item.status === filterValue;
            });
        }

        // Show empty message if no requests match
        if (requestsList.length === 0) {
            var filterLabel = (filterValue !== 'ALL') ? filterValue : '';
            tbody.innerHTML = '<tr>' +
                '<td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">' +
                    '<i class="fa-regular fa-folder-open fa-2x" style="margin-bottom: 10px; display: block; opacity: 0.5;"></i>' +
                    'No ' + filterLabel + ' task requests found.' +
                '</td>' +
            '</tr>';
            return;
        }

        // Build HTML table rows
        var rowsHtml = '';
        
        for (var i = 0; i < requestsList.length; i++) {
            var request = requestsList[i];
            var rowNumber = i + 1;
            
            // Status badge HTML
            var statusBadge = '';
            if (request.status === 'Approved') {
                statusBadge = '<span class="status-badge status-completed"><i class="fa-solid fa-circle-check"></i> Approved</span>';
            } else if (request.status === 'Rejected') {
                var rejReason = request.rejection_reason || 'N/A';
                statusBadge = '<span class="status-badge status-on-hold" style="background:#fee2e2; color:#ef4444;" title="Reason: ' + escapeHtml(rejReason) + '"><i class="fa-solid fa-circle-xmark"></i> Rejected</span>';
            } else {
                statusBadge = '<span class="status-badge status-pending" style="background:#fef3c7; color:#d97706;"><i class="fa-solid fa-clock"></i> Pending</span>';
            }

            // Action buttons HTML
            var actionButtons = '';
            if (request.status === 'Pending') {
                actionButtons = '<div style="display: flex; gap: 8px; justify-content: center;">' +
                    '<button onclick="approveRequest(' + request.id + ')" class="btn" style="background: #10b981; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s;">' +
                        '<i class="fa-solid fa-check"></i> Approve' +
                    '</button>' +
                    '<button onclick="openRejectRequestModal(' + request.id + ', \'' + escapeHtml(request.employee_name) + '\', \'' + escapeHtml(request.task_name) + '\')" class="btn" style="background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s;">' +
                        '<i class="fa-solid fa-xmark"></i> Reject' +
                    '</button>' +
                '</div>';
            } else {
                actionButtons = '<span style="font-size: 12px; color: var(--text-muted); font-style: italic;">Completed</span>';
            }

            // Request reason text
            var reasonDisplay = escapeHtml(request.reason || '-');
            if (request.status === 'Rejected' && request.rejection_reason) {
                reasonDisplay += '<br><small style="color: #ef4444; font-weight: 600;">Rejection Reason: ' + escapeHtml(request.rejection_reason) + '</small>';
            }

            // Combine into table row
            rowsHtml += '<tr style="border-bottom: 1px solid #f1f5f9;">' +
                '<td style="padding: 14px 16px; font-weight: 600;">' + rowNumber + '</td>' +
                '<td style="padding: 14px 16px;"><strong style="color: var(--text-dark); display: block; font-size: 14px;">' + escapeHtml(request.employee_name) + '</strong></td>' +
                '<td style="padding: 14px 16px; font-weight: 600; color: var(--primary);" data-tooltip="' + escapeHtml(request.task_name) + '" title="' + escapeHtml(request.task_name) + '"><div class="task-name-truncate">' + escapeHtml(request.task_name) + '</div></td>' +
                '<td style="padding: 14px 16px;" title="' + escapeHtml(request.project_name || '-') + '">' + escapeHtml(request.project_name || '-') + '</td>' +
                '<td style="padding: 14px 16px; font-size: 13px;" data-tooltip="' + escapeHtml(request.reason || '-') + '" title="' + escapeHtml(request.reason || '-') + '"><div class="task-desc-truncate">' + reasonDisplay + '</div></td>' +
                '<td style="padding: 14px 16px; font-size: 12px; color: var(--text-muted);">' + (request.created_at || '-') + '</td>' +
                '<td style="padding: 14px 16px;">' + statusBadge + '</td>' +
                '<td style="padding: 14px 16px; text-align: center;">' + actionButtons + '</td>' +
            '</tr>';
        }

        tbody.innerHTML = rowsHtml;
    }

    // Filter table rows when user selects a different status option
    function filterTaskRequests(statusValue) {
        renderTaskRequestsTable(statusValue);
    }

    // Approve a task request using POST request
    function approveRequest(requestId) {
        Swal.fire({
            title: 'Approve Request?',
            text: 'Allow employee to work on this task concurrently?',
            icon: 'question',
            iconColor: '#10b981',
            width: '380px',
            padding: '16px 20px',
            showCancelButton: true,
            confirmButtonText: 'Approve',
            cancelButtonText: 'Cancel',
            confirmButtonColor: '#10b981',
            cancelButtonColor: '#64748b'
        }).then(function(result) {
            if (result.isConfirmed) {
                fetch('/api/tasks/request/approve/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ request_id: requestId })
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    if (data.status === 'success') {
                        Swal.fire({
                            title: 'Approved',
                            text: data.message,
                            icon: 'success',
                            width: '380px',
                            confirmButtonColor: '#4f46e5'
                        });
                        loadTaskRequestsTab();
                        if (typeof fetchUnreadNotifications === 'function') {
                            fetchUnreadNotifications();
                        }
                    } else {
                        Swal.fire({
                            title: 'Error',
                            text: data.message || 'Failed to approve request.',
                            icon: 'error',
                            width: '380px',
                            confirmButtonColor: '#ef4444'
                        });
                    }
                });
            }
        });
    }

    // Open rejection modal to prompt for rejection reason
    function openRejectRequestModal(requestId, employeeName, taskName) {
        Swal.fire({
            title: 'Reject Request',
            width: '420px',
            padding: '16px 20px',
            html: '<div style="text-align: left; font-size: 13px; color: #475569; margin-top: 6px;">' +
                '<p style="margin-bottom: 10px;">' +
                    'Provide reason for rejecting <strong style="color: #0f172a;">' + escapeHtml(employeeName) + '</strong>\'s request for <strong style="color: #4f46e5;">"' + escapeHtml(taskName) + '"</strong>:' +
                '</p>' +
                '<textarea id="swal-rejection-reason" class="swal2-textarea" placeholder="Reason for rejection..." style="width: 100%; margin: 0; background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; font-size: 13px; min-height: 70px; box-shadow: none;"></textarea>' +
            '</div>',
            icon: 'warning',
            iconColor: '#ef4444',
            showCancelButton: true,
            confirmButtonText: 'Reject Request',
            cancelButtonText: 'Cancel',
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#64748b',
            preConfirm: function() {
                var reasonInput = document.getElementById('swal-rejection-reason');
                var reason = reasonInput ? reasonInput.value.trim() : '';
                if (!reason) {
                    Swal.showValidationMessage('Rejection reason is required.');
                    return false;
                }
                return reason;
            }
        }).then(function(result) {
            if (result.isConfirmed && result.value) {
                fetch('/api/tasks/request/reject/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        request_id: requestId,
                        rejection_reason: result.value
                    })
                })
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    if (data.status === 'success') {
                        Swal.fire({
                            title: 'Rejected',
                            text: data.message,
                            icon: 'success',
                            width: '380px',
                            confirmButtonColor: '#4f46e5'
                        });
                        loadTaskRequestsTab();
                        if (typeof fetchUnreadNotifications === 'function') {
                            fetchUnreadNotifications();
                        }
                    } else {
                        Swal.fire({
                            title: 'Error',
                            text: data.message || 'Failed to reject request.',
                            icon: 'error',
                            width: '380px',
                            confirmButtonColor: '#ef4444'
                        });
                    }
                });
            }
        });
    }

    // Helper function to safely escape special HTML characters
    function escapeHtml(text) {
        if (!text) {
            return '';
        }
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
