{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log Note - Login</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <style>
        .field-error-text {
            color: #ef4444;
            font-size: 12px;
            font-weight: 500;
            margin-top: 6px;
            display: block;
            min-height: 16px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>LOGNOTE</h1>
            </div>
            <p class="login-text"><b>WELCOME</b></p>
            <form method="POST" action="{% url 'login' %}">

                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ username|default:'' }}" placeholder="Enter username" pattern="[A-Za-z0-9]+" required>
                    <span class="field-error-text" id="username-error">{% if error %}{{ error }}{% endif %}</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <span class="field-error-text" id="password-error"></span>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>

</html>
