{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log Note - Login</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>LOGNOTE</h1>
            </div>
            <p class="login-text"><b>WELCOME</b></p>
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'error' }}" style="color: #dc2626; background: #fee2e2; border: 1px solid #fca5a5; padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; font-weight: 500;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}
            <form method="POST" action="{% url 'login' %}">

                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>

</html>
